apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-app-ingress
spec:
  rules:
    - host: "go-web-app.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: go-web-app-service
                port:
                  number: 80
