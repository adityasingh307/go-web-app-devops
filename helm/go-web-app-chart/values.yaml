# Default values for a go-web-app application.

replicaCount: 1

image:
  repository: aditya3k4/go-web-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "37036280443"

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: go-web-app.com
      paths:
        - path: /
          pathType: ImplementationSpecific
